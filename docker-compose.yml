# IoT-Haus 2.0 – lokal bauen und starten: docker compose up -d --build
# Der Healthcheck kommt aus dem Image (Dockerfile, ohne curl).

services:
  iot-haus:
    build: .
    ports:
      - "3000:3000"    # HTTP und WebSocket (/mqtt)
    environment:
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
      - MQTT_BROKER_HOST=127.0.0.1
      - MQTT_BROKER_PORT=1883
      # Strompreis in €/kWh mit Dezimalpunkt (Standard 0.35):
      # - STROMPREIS_EUR_PRO_KWH=0.32
    volumes:
      - mosquitto-data:/var/lib/mosquitto   # Gerätezustände und Tagesverbrauch
    restart: unless-stopped
    container_name: iot-haus-control

volumes:
  mosquitto-data:
    driver: local
