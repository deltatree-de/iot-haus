# IoT-Haus 2.1 – lokal bauen und starten: docker compose up -d --build
# Der Healthcheck kommt aus dem Image (Dockerfile, ohne curl).

services:
  iot-haus:
    build: .
    ports:
      - "3000:3000"    # HTTP und WebSocket (/mqtt)
    environment:
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
      - MQTT_BROKER_HOST=127.0.0.1
      - MQTT_BROKER_PORT=1883
      # Strompreis in €/kWh mit Dezimalpunkt (Standard 0.35):
      # - STROMPREIS_EUR_PRO_KWH=0.32
      # Einspeisevergütung in €/kWh mit Dezimalpunkt (Standard 0.08):
      # - EINSPEISEVERGUETUNG_EUR_PRO_KWH=0.08
      # Optional gegen DNS-Rebinding: nur diese Hostnamen dürfen den WebSocket öffnen (ohne Port):
      # - ERLAUBTE_HOSTS=haus.local,192.168.1.10
    volumes:
      - mosquitto-data:/var/lib/mosquitto   # Gerätezustände, Elektroauto, Sonnenlage, Tagesenergie
    restart: unless-stopped
    container_name: iot-haus-control

volumes:
  mosquitto-data:
    driver: local
