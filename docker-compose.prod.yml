# IoT-Haus 2.1 – Produktion mit dem Image aus der GitHub Container Registry.
# Update: docker compose -f docker-compose.prod.yml pull && docker compose -f docker-compose.prod.yml up -d
# Der Healthcheck kommt aus dem Image (Dockerfile, ohne curl) – hier keinen eigenen healthcheck-Block setzen.

services:
  iot-haus:
    image: ghcr.io/deltatree-de/iot-haus:latest
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
      - MQTT_BROKER_HOST=127.0.0.1
      - MQTT_BROKER_PORT=1883
      # Strompreis in €/kWh mit Dezimalpunkt (Standard 0.35):
      # - STROMPREIS_EUR_PRO_KWH=0.32
      # Einspeisevergütung in €/kWh mit Dezimalpunkt (Standard 0.08):
      # - EINSPEISEVERGUETUNG_EUR_PRO_KWH=0.08
      # Optional gegen DNS-Rebinding: nur diese Hostnamen dürfen den WebSocket öffnen (ohne Port):
      # - ERLAUBTE_HOSTS=haus.local,192.168.1.10
    volumes:
      - mosquitto-data:/var/lib/mosquitto
    restart: unless-stopped
    container_name: iot-haus-control

volumes:
  mosquitto-data:
    driver: local
