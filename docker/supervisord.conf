; Läuft vollständig als Benutzer node (USER im Dockerfile).
; Logs gehen nach stdout, damit sie im Container-Log sichtbar sind.
[supervisord]
nodaemon=true
; nodaemon schreibt schon nach stdout; eine zweite Logdatei verdoppelt jede Zeile.
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisor/supervisord.pid

[program:mosquitto]
command=mosquitto -c /etc/mosquitto/mosquitto.conf
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
priority=100
stopwaitsecs=5

[program:nextjs-server]
command=node dist/server/index.js
directory=/app
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
priority=200
; Node stoppt vor Mosquitto (umgekehrte Priorität) und sichert dabei den Tagesverbrauch.
stopsignal=TERM
stopwaitsecs=5
environment=NODE_ENV="production"

[unix_http_server]
file=/run/supervisor/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///run/supervisor/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface
