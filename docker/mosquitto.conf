# Mosquitto MQTT Broker Configuration

# Basic settings
persistence true
persistence_location /var/lib/mosquitto/

# Logging
# Nur stdout: der Broker läuft als node und schreibt keine Logdatei.
log_dest stdout
log_type error
log_type warning
log_type notice
# Keine Informationsstufe: sonst eine Zeile „Saving in-memory database“ je gespeicherter Änderung.

# Default listener on port 1883 (internal only)
listener 1883 127.0.0.1
protocol mqtt

# No WebSocket listener needed - Node.js server handles WebSocket proxy

# Allow anonymous access (for demo purposes)
allow_anonymous true

# No authentication required (for demo)
# In production, you should configure proper authentication
# password_file /etc/mosquitto/passwd

# Connection settings
max_connections 1000
max_inflight_messages 20
max_queued_messages 100

# Persistence settings
# Nach jeder Änderung speichern: Zustand übersteht Neustarts (FR-17)
autosave_interval 1
autosave_on_changes true
persistent_client_expiration 2m

# Logging levels
connection_messages true
log_timestamp true
